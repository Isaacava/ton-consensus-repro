name: ton-consensus-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Clone TON repository
        run: |
          git clone https://github.com/ton-blockchain/ton.git
          cd ton
          git checkout testnet
          git rev-parse HEAD

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake ninja-build libsodium-dev libssl-dev

      - name: Build TON validator
        run: |
          cd ton
          mkdir build
          cd build
          cmake ..
          make -j2

      - name: Inspect consensus validator code
        run: |
          cd ton
          echo "Searching consensus code..."
          grep -R "validation_result" validator/consensus || true
          grep -R "CandidateReject" validator/consensus || true
          grep -R "CandidateAccept" validator/consensus || true

      - name: Save consensus code snapshot
        run: |
          cd ton
          mkdir proof
          cp validator/consensus/*.cpp proof/ || true
          cp validator/consensus/*.h proof/ || true

      - name: Upload proof files
        uses: actions/upload-artifact@v4
        with:
          name: consensus-proof
          path: ton/proof
