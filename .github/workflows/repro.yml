name: ton-consensus-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone TON source
        run: |
          git clone https://github.com/ton-blockchain/ton.git
          cd ton
          git checkout testnet
          echo "TON commit:"
          git rev-parse HEAD

      - name: List consensus directory
        run: |
          cd ton
          echo "Consensus files:"
          ls validator/consensus

      - name: Search suspicious logic
        run: |
          cd ton
          echo "Searching for candidate validation logic..."
          grep -R "CandidateAccept" validator/consensus || true
          grep -R "CandidateReject" validator/consensus || true
          grep -R "validation_result" validator/consensus || true
          grep -R "leader" validator/consensus || true

      - name: Save consensus code snapshot
        run: |
          cd ton
          mkdir proof
          cp validator/consensus/*.cpp proof/ || true
          cp validator/consensus/*.h proof/ || true
          echo "Saved consensus code snapshot."

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: consensus-proof
          path: ton/proof
